<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="text-center py-4">
        <h1 class="site-title">Мой первый сайт</h1>
        <nav class="mt-3">
            <a href="index.html" class="nav-link-custom">Главная</a>
            <a href="about.html" class="nav-link-custom">О проекте</a>
            <a href="contacts.html" class="nav-link-custom active">Контакты</a>
        </nav>
    </header>

    <main class="container pb-5">
        <div class="custom-card">
            <h2 class="welcome-title">Контакты</h2>
            <p class="card-text">
                Если хотите связаться со мной, напишите мне на почту: 

                <a href="mailto:salmanansona@gmail.com" class="email-link">salmanansona@gmail.com</a>
            </p>

            <hr class="my-4">

            <!-- Вот та самая форма, которой не было -->
            <h4 style="color: #a89f91; font-size: 1.2rem;">Или оставьте сообщение:</h4>
            <form id="contactForm">
                <div class="mb-3">
                    <input type="text" id="name" class="form-control" placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                    <input type="email" id="email" class="form-control" placeholder="Ваш Email">
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
            <p id="formMessage" class="mt-3 fw-bold"></p>
        </div>
    </main>
</body>
</html>
